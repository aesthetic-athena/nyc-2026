          <h1 id="headerTitle" class="text-[15px] font-bold tracking-tight text-sumi truncate mt-0.5">NYC Thanksgiving & Birthday</h1>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">

          <button onclick="switchTab('tickets')" aria-label="Ticket Wallet" title="Ticket & QR Wallet"
                  class="relative p-1.5 rounded-full bg-paper border border-hairline text-sumi hover:border-matcha transition-colors">
            <span class="text-xs leading-none block">🎫</span>
            <span id="headerTicketBadge" class="hidden absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-matcha text-white text-[9px] font-bold flex items-center justify-center">0</span>
          </button>

          <!-- App Install / Offline Save Guide Button -->
          <button onclick="openInstallModal()" aria-label="Install App" title="Save to iPhone Home Screen"
                  class="px-2 py-1 rounded-full bg-paper border border-hairline text-[11px] font-semibold text-sumi hover:border-matcha transition-colors flex items-center gap-1">
            <span>📲</span>
            <span id="installBtnText" class="hidden sm:inline">App</span>
          </button>

          <!-- Trilingual Switcher Pill -->
          <div class="inline-flex items-center bg-sand p-0.5 rounded-full border border-hairline" role="group" aria-label="Language Switcher">
            <button onclick="setLanguage('en')" id="lang-en" class="px-2 py-1 rounded-full text-[11px] font-bold transition-all">EN</button>
            <button onclick="setLanguage('zh')" id="lang-zh" class="px-2 py-1 rounded-full text-[11px] font-bold transition-all">繁中</button>
            <button onclick="setLanguage('de')" id="lang-de" class="px-2 py-1 rounded-full text-[11px] font-bold transition-all">DE</button>
          </div>
        </div>
      </div>

      <!-- Day Selector Pills (Shown on Itinerary Tab) -->
      <div id="daySelectorWrapper" class="mt-3 -mx-4 px-4 overflow-x-auto no-scrollbar flex items-center gap-1.5"></div>
    </header>

    <!-- Main Scrollable Viewport -->
    <main id="appContent" class="flex-1 px-4 pt-3.5 pb-safe space-y-3.5"></main>

    <!-- Hidden File Input for Ticket QR Upload -->
    <input type="file" id="qrFileInput" accept="image/*" class="hidden" onchange="handleTicketFileUpload(event)" />

    <!-- Full-Screen High-Contrast QR Scanner Modal -->
    <div id="qrScannerModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-[430px] rounded-2xl overflow-hidden shadow-2xl border border-hairline flex flex-col max-h-[92vh]">
        <!-- Modal Header -->
        <div class="px-4 py-3 bg-washi border-b border-hairline flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p id="qrModalDate" class="text-[11px] font-bold text-maple uppercase tracking-wider truncate"></p>
            <h3 id="qrModalTitle" class="text-sm font-bold text-sumi truncate"></h3>
          </div>
          <button onclick="closeQrModal()" class="p-1.5 rounded-full bg-paper border border-hairline text-sumi hover:bg-sand">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Bright High-Contrast Image Canvas -->
        <div class="p-4 bg-white flex-1 overflow-y-auto flex flex-col items-center justify-center">
          <div class="p-2.5 bg-white border-2 border-sumi/15 rounded-2xl shadow-sm flex items-center justify-center">
            <img id="qrModalImg" src="" alt="Ticket QR Code" class="max-w-full max-h-[55vh] object-contain rounded-lg transition-transform duration-200" />
          </div>
          <p id="qrModalNote" class="mt-3 text-xs font-semibold text-sumi bg-sand px-3 py-1 rounded-full text-center"></p>
          <p id="qrModalBrightnessTip" class="mt-1.5 text-[11px] text-ash text-center"></p>
        </div>

        <!-- Modal Footer Actions -->
        <div class="px-4 py-3 bg-washi border-t border-hairline flex items-center gap-2">
          <button onclick="triggerReplaceQr()" class="flex-1 py-2.5 px-3 rounded-xl bg-paper border border-hairline text-xs font-bold text-sumi hover:border-matcha">

          <button onclick="deleteCurrentQr()" class="py-2.5 px-3 rounded-xl bg-maple-light text-maple text-xs font-bold">
            <span id="qrDeleteLabel">Delete</span>
          </button>
          <button onclick="closeQrModal()" class="py-2.5 px-5 rounded-xl bg-sumi text-white text-xs font-bold">
            OK
          </button>
        </div>
      </div>
    </div>

    function loadState() {

        if (saved) {

          state = {
            ...state,
            ...parsed,
            flights: { ...state.flights, ...(parsed.flights || {}) },
            tipCalc: { ...state.tipCalc, ...(parsed.tipCalc || {}) },
            ticketImages: parsed.ticketImages || {},
            tickets: Array.isArray(parsed.tickets) && parsed.tickets.length ? parsed.tickets : state.tickets
          };
        }
      } catch (e) {
        console.warn('Could not load saved state:', e);
      }

      try {
        const cachedW = localStorage.getItem(WEATHER_CACHE_KEY);
        if (cachedW) {
          const parsedW = JSON.parse(cachedW);
          if (parsedW && parsedW.daily) {
            weatherState = { source: 'cached', daily: parsedW.daily };
          }
        }
      } catch (e) {
        console.warn('Could not load weather cache:', e);
      }
    }

      '2026-11-21': { max: 11, min: 4, pop: 20, code: 2 },

      '2026-11-23': { max: 9, min: 2, pop: 30, code: 3 },

    function getWeatherEmoji(code) {
      if (code === 0) return '☀️';
      if (code === 1 || code === 2) return '⛅';
      if (code === 3) return '☁️';
      if (code >= 45 && code <= 48) return '🌫️';
      if (code >= 51 && code <= 67) return '🌧️';
      if (code >= 71 && code <= 77) return '❄️';
      if (code >= 80 && code <= 82) return '🌦️';
      return '🌤️';
    }

    async function fetchNycWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.7580&longitude=-73.9855&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FNew_York&forecast_days=14';
        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather API failed');
        const data = await res.json();
        if (data && data.daily && Array.isArray(data.daily.time)) {
          const mapped = {};
          data.daily.time.forEach((dateStr, idx) => {
            mapped[dateStr] = {
              max: Math.round(data.daily.temperature_2m_max[idx]),
              min: Math.round(data.daily.temperature_2m_min[idx]),
              pop: data.daily.precipitation_probability_max[idx] ?? 10,
              code: data.daily.weathercode[idx] ?? 1
            };
          });
          weatherState = { source: 'live', daily: mapped };
          localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ updatedAt: Date.now(), daily: mapped }));
          if (state.activeTab === 'itinerary') renderApp();
        }
      } catch (err) {
        // Offline or out-of-range: keep cached or seasonal fallback
      }
    }

    function getDayWeather(dateISO) {
      if (weatherState.daily && weatherState.daily[dateISO]) {
        return { ...weatherState.daily[dateISO], source: weatherState.source };
      }
      const keys = Object.keys(weatherState.daily || {});
      if (keys.length > 0 && weatherState.source === 'live') {
        const idx = Math.min(keys.length - 1, Math.max(0, parseInt(dateISO.slice(-2), 10) - 21));
        if (weatherState.daily[keys[idx]]) {
          return { ...weatherState.daily[keys[idx]], source: 'live' };
        }
      }
      const fb = seasonalFallbackWeather[dateISO] || { max: 9, min: 2, pop: 20, code: 2 };
      return { ...fb, source: weatherState.source === 'cached' ? 'cached' : 'fallback' };
    }

    // ==========================================
    // 8. TICKET QR UPLOAD, COMPRESSION & MODAL
    // ==========================================
    function triggerUploadQr(slotId) {
      activeUploadSlotId = slotId;
      const input = document.getElementById('qrFileInput');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function handleTicketFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file || !activeUploadSlotId) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          // Compress screenshot so QR remains crisp while fitting comfortably in localStorage
          const maxDim = 960;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
          state.ticketImages[activeUploadSlotId] = compressedDataUrl;
          saveState();
          showToast(i18n[state.lang].qrSavedToast);
          renderApp();

          // If modal was open for replacement, refresh modal image
          if (activeModalTicketId === activeUploadSlotId) {
            openQrModal(activeUploadSlotId);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function openQrModal(slotId) {
      const slot = state.tickets.find(s => s.id === slotId);
      const imgData = state.ticketImages[slotId];
      if (!slot) return;
      if (!imgData) {
        triggerUploadQr(slotId);
        return;
      }
      activeModalTicketId = slotId;
      const dict = i18n[state.lang];
      document.getElementById('qrModalDate').textContent = slot.dayTag || '';
      document.getElementById('qrModalTitle').textContent = t(slot.title);
      document.getElementById('qrModalImg').src = imgData;
      document.getElementById('qrModalNote').textContent = t(slot.note);
      document.getElementById('qrModalBrightnessTip').textContent = dict.brightnessTip;
      document.getElementById('qrReplaceLabel').textContent = dict.replaceQr;
      document.getElementById('qrDeleteLabel').textContent = dict.deleteQr;
      document.getElementById('qrScannerModal').classList.remove('hidden');
    }

    function closeQrModal() {
      activeModalTicketId = null;
      document.getElementById('qrScannerModal').classList.add('hidden');
    }

    function triggerReplaceQr() {
      if (activeModalTicketId) {
        triggerUploadQr(activeModalTicketId);
      }
    }

    function deleteCurrentQr() {
      if (!activeModalTicketId) return;
      delete state.ticketImages[activeModalTicketId];
      saveState();
      closeQrModal();
      showToast(i18n[state.lang].qrDeletedToast);

    function downloadStandaloneHtml() {
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nyc_itinerary_app.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Downloading nyc_itinerary_app.html...');
    }

                  <span class="w-4 h-4 rounded border flex items-center justify-center shrink-0 ${
                    item.done ? 'bg-matcha border-matcha text-white' : 'border-ash/40 bg-white'
                  }">${item.done ? '✓' : ''}</span>
                  <span class="text-xs ${item.done ? 'line-through text-ash' : 'text-sumi font-medium'}">${escapeHtml(item.text)}</span>
                </button>
                <button onclick="deleteShopItem('${item.id}')" class="text-ash hover:text-maple text-xs px-1">✕</button>
              </div>
            `).join('')}
          </div>
          <div class="flex gap-2 pt-1">
            <input id="newShopInput" type="text" placeholder="${dict.addShopPlaceholder}"
              onkeydown="if(event.key==='Enter') addShopItem()"
              class="flex-1 px-3 py-2 rounded-xl bg-washi border border-hairline text-xs text-sumi focus:outline-none focus:border-matcha" />
            <button onclick="addShopItem()" class="px-3.5 py-2 rounded-xl bg-sumi text-white text-xs font-bold">+</button>
          </div>
        </div>

        <!-- Iconic Fast Food Chains -->
        <div class="space-y-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-sumi px-1">${dict.fastFoodTitle}</h2>
          ${fastFoodChains.map(ff => `
            <div class="muji-card p-3.5 border-l-4 border-l-maple">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex items-center gap-1.5">
                    <h3 class="text-sm font-bold text-sumi">${escapeHtml(ff.name)}</h3>
                    <span class="px-2 py-0.5 rounded-md bg-maple-light text-maple-dark text-[10px] font-bold">${escapeHtml(t(ff.tag))}</span>
                  </div>
                  <p class="text-xs text-ash leading-relaxed mt-1">${escapeHtml(t(ff.desc))}</p>
                </div>
                <a href="${getMapsUrl(ff.query)}" target="_blank" rel="noopener noreferrer"
                   class="shrink-0 px-2.5 py-1.5 rounded-xl bg-washi border border-hairline text-[11px] font-semibold text-sumi hover:border-maple">
                  ${dict.findNearest}
                </a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function updateFlightField(field, val) {
      state.flights[field] = val;
      saveState();
    }

    function addExpense() {
      const titleEl = document.getElementById('expTitleInput');
      const amtEl = document.getElementById('expAmountInput');
      const catEl = document.getElementById('expCatSelect');
      const payerEl = document.getElementById('expPayerSelect');
      const title = (titleEl?.value || '').trim();
      const amount = parseFloat(amtEl?.value || '0');
      if (!title || isNaN(amount) || amount <= 0) return;
      state.expenses.unshift({
        id: 'ex-' + Date.now(),
        title,
        amount,
        category: catEl?.value || 'Dining',
        payer: payerEl?.value || 'Athena'
      });
      saveState();
      renderApp();
    }

    function deleteExpense(id) {
      state.expenses = state.expenses.filter(e => e.id !== id);
      saveState();
      renderApp();
    }

    function updateTipCalc(key, val) {
      state.tipCalc[key] = val;
      saveState();
      renderApp();
    }

    function renderTravelAndBudgetTab() {
      const dict = i18n[state.lang];
      const totalUsd = state.expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const estEur = (totalUsd * 0.92).toFixed(0);

      const sub = Number(state.tipCalc.subtotal || 0);
      const tax = state.tipCalc.includeTax ? sub * 0.08875 : 0;
      const tip = sub * (Number(state.tipCalc.tipPct || 20) / 100);
      const grand = sub + tax + tip;

      return `
        <!-- Flights Card -->
        <div class="muji-card p-3.5 space-y-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slateink">${dict.flightSection}</h2>
          <div class="grid grid-cols-1 gap-2.5">
            <div class="p-3 rounded-xl bg-washi border border-hairline space-y-1.5">
              <p class="text-[11px] font-bold text-matcha uppercase">${dict.outbound}</p>
              <input value="${escapeHtml(state.flights.outNo)}" onchange="updateFlightField('outNo', this.value)"
                class="w-full bg-paper px-2.5 py-1.5 rounded-lg border border-hairline text-xs font-bold text-sumi" />
              <div class="grid grid-cols-2 gap-1.5">
                <input value="${escapeHtml(state.flights.outRef)}" onchange="updateFlightField('outRef', this.value)"
                  class="bg-paper px-2.5 py-1 rounded-lg border border-hairline text-[11px] text-ash" />
                <input value="${escapeHtml(state.flights.outTime)}" onchange="updateFlightField('outTime', this.value)"
                  class="bg-paper px-2.5 py-1 rounded-lg border border-hairline text-[11px] text-ash" />
              </div>
            </div>

            <div class="p-3 rounded-xl bg-washi border border-hairline space-y-1.5">
              <p class="text-[11px] font-bold text-maple uppercase">${dict.inbound}</p>
              <input value="${escapeHtml(state.flights.inNo)}" onchange="updateFlightField('inNo', this.value)"
                class="w-full bg-paper px-2.5 py-1.5 rounded-lg border border-hairline text-xs font-bold text-sumi" />
              <div class="grid grid-cols-2 gap-1.5">
                <input value="${escapeHtml(state.flights.inRef)}" onchange="updateFlightField('inRef', this.value)"
                  class="bg-paper px-2.5 py-1 rounded-lg border border-hairline text-[11px] text-ash" />
                <input value="${escapeHtml(state.flights.inTime)}" onchange="updateFlightField('inTime', this.value)"
                  class="bg-paper px-2.5 py-1 rounded-lg border border-hairline text-[11px] text-ash" />
              </div>
            </div>
          </div>
        </div>

        <!-- Hotel Card -->
        <div class="muji-card p-3.5 space-y-2.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-matcha">${dict.hotelSection}</span>
              <h3 class="text-sm font-bold text-sumi mt-0.5">Club Quarters Hotel Grand Central</h3>
              <p class="text-xs text-ash mt-0.5">40 E 45th St, New York, NY 10017</p>
              <p class="text-[11px] font-semibold text-sumi mt-1">Check-in: Nov 21 · Check-out: Nov 28 (7 Nights)</p>
            </div>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <button onclick="copyText('Club Quarters Hotel Grand Central, 40 E 45th St, New York, NY 10017')"
              class="flex-1 py-2 px-3 rounded-xl bg-washi border border-hairline text-xs font-semibold text-sumi hover:border-matcha">
              📋 ${dict.copyAddress}
            </button>
            <a href="${getMapsUrl('Club Quarters Hotel Grand Central, 40 E 45th St, New York, NY')}" target="_blank" rel="noopener noreferrer"
               class="py-2 px-3.5 rounded-xl bg-matcha text-white text-xs font-bold">
              ${dict.navigate}
            </a>
          </div>
        </div>

        <!-- Expense Tracker -->
        <div class="muji-card p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold uppercase tracking-wider text-sumi">${dict.budgetSection}</h2>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="p-3 rounded-xl bg-matcha-light/70 border border-matcha/20">
              <p class="text-[10px] font-bold uppercase text-matcha-dark">${dict.totalSpent}</p>
              <p class="text-lg font-bold text-sumi mt-0.5">$${totalUsd.toFixed(2)}</p>
            </div>
            <div class="p-3 rounded-xl bg-sand border border-hairline">
              <p class="text-[10px] font-bold uppercase text-ash">${dict.estEuro}</p>
              <p class="text-lg font-bold text-sumi mt-0.5">~€${estEur}</p>
            </div>
          </div>

          <!-- Add New Expense Form -->
          <div class="p-2.5 rounded-xl bg-washi border border-hairline space-y-2">
            <p class="text-[11px] font-bold text-ash">${dict.addExpenseTitle}</p>
            <div class="flex gap-1.5">
              <input id="expTitleInput" type="text" placeholder="${dict.itemPlaceholder}"
                class="flex-1 px-2.5 py-1.5 rounded-lg bg-paper border border-hairline text-xs text-sumi" />
              <input id="expAmountInput" type="number" step="0.01" placeholder="${dict.amountPlaceholder}"
                class="w-24 px-2.5 py-1.5 rounded-lg bg-paper border border-hairline text-xs text-sumi" />
            </div>
            <div class="flex gap-1.5">
              <select id="expCatSelect" class="flex-1 px-2 py-1.5 rounded-lg bg-paper border border-hairline text-xs text-sumi">
                ${Object.keys(dict.catLabels).map(k => `<option value="${k}">${dict.catLabels[k]}</option>`).join('')}
              </select>
              <select id="expPayerSelect" class="px-2 py-1.5 rounded-lg bg-paper border border-hairline text-xs text-sumi">
                <option value="Athena">Athena</option>
                <option value="Konrad">Konrad</option>
              </select>
              <button onclick="addExpense()" class="px-3.5 py-1.5 rounded-lg bg-sumi text-white text-xs font-bold">${dict.addBtn}</button>
            </div>
          </div>

          <!-- Expense List -->
          <div class="space-y-1.5 max-h-60 overflow-y-auto">
            ${state.expenses.map(ex => `
              <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-washi border border-hairline text-xs">
                <div class="min-w-0">
                  <p class="font-semibold text-sumi truncate">${escapeHtml(ex.title)}</p>
                  <p class="text-[10px] text-ash">${dict.catLabels[ex.category] || ex.category} · ${dict.paidBy} ${escapeHtml(ex.payer)}</p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="font-bold text-sumi">$${Number(ex.amount).toFixed(2)}</span>
                  <button onclick="deleteExpense('${ex.id}')" class="text-ash hover:text-maple">✕</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- NYC Sales Tax & Tip Calculator -->
        <div class="muji-card p-3.5 space-y-2.5">
          <h2 class="text-xs font-bold uppercase tracking-wider text-maple">${dict.tipCalcTitle}</h2>
          <div>
            <label class="text-[11px] font-semibold text-ash block mb-1">${dict.subtotalLabel}</label>
            <input type="number" step="0.01" value="${sub}" oninput="updateTipCalc('subtotal', parseFloat(this.value) || 0)"
              class="w-full px-3 py-2 rounded-xl bg-washi border border-hairline text-sm font-bold text-sumi" />
          </div>
          <div class="flex items-center justify-between gap-2">
            <label class="inline-flex items-center gap-2 text-xs font-medium text-sumi cursor-pointer">
              <input type="checkbox" ${state.tipCalc.includeTax ? 'checked' : ''} onchange="updateTipCalc('includeTax', this.checked)"
                class="rounded text-matcha" />
              <span>${dict.nycTaxToggle}</span>
            </label>
            <div class="inline-flex rounded-xl bg-sand p-0.5 border border-hairline">
              ${[18, 20, 22].map(pct => `
                <button onclick="updateTipCalc('tipPct', ${pct})" class="px-2.5 py-1 rounded-lg text-xs font-bold ${
                  state.tipCalc.tipPct === pct ? 'bg-matcha text-white' : 'text-ash'
                }">${pct}%</button>
              `).join('')}
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-1 text-center">
            <div class="p-2 rounded-xl bg-washi border border-hairline">
              <p class="text-[10px] text-ash">${dict.taxAmt}</p>
              <p class="text-xs font-bold text-sumi mt-0.5">$${tax.toFixed(2)}</p>
            </div>
            <div class="p-2 rounded-xl bg-washi border border-hairline">
              <p class="text-[10px] text-ash">${dict.tipAmt} (${state.tipCalc.tipPct}%)</p>
              <p class="text-xs font-bold text-sumi mt-0.5">$${tip.toFixed(2)}</p>
            </div>
            <div class="p-2 rounded-xl bg-maple-light/70 border border-maple/25">
              <p class="text-[10px] font-bold text-maple-dark">${dict.grandTotal}</p>
              <p class="text-sm font-bold text-sumi mt-0.5">$${grand.toFixed(2)}</p>
            </div>
          </div>
        </div>
      `;
    }

    function togglePackItem(groupId, itemId) {
      const grp = state.packingGroups.find(g => g.id === groupId);
      const item = grp?.items.find(i => i.id === itemId);
      if (item) {
        item.done = !item.done;
        saveState();
        renderApp();
      }
    }

    function resetPacking() {
      state.packingGroups.forEach(g => g.items.forEach(i => (i.done = false)));
      saveState();
      renderApp();
    }

    function renderPackingTab() {
      const dict = i18n[state.lang];
      let total = 0;
      let done = 0;
      state.packingGroups.forEach(g => {
        g.items.forEach(i => {
          total++;
          if (i.done) done++;
        });
      });
      const pct = total ? Math.round((done / total) * 100) : 0;

      return `
        <!-- Progress Card -->
        <div class="muji-card p-3.5 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-sumi">${dict.packingProgress}: ${done}/${total} (${pct}%)</span>
            <button onclick="resetPacking()" class="text-[11px] font-semibold text-ash hover:text-maple">${dict.resetPacking}</button>
          </div>
          <div class="w-full h-2 bg-sand rounded-full overflow-hidden">
            <div class="h-full bg-matcha transition-all duration-300" style="width: ${pct}%"></div>
          </div>
        </div>

        <!-- Packing Categories -->
        ${state.packingGroups.map(grp => `
          <div class="muji-card p-3.5 space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-matcha">${escapeHtml(t(grp.title))}</h3>
            <div class="space-y-1.5">
              ${grp.items.map(it => `
                <button onclick="togglePackItem('${grp.id}', '${it.id}')"
                  class="w-full flex items-start gap-2.5 p-2 rounded-xl bg-washi border border-hairline text-left">
                  <span class="mt-0.5 w-4 h-4 rounded border flex items-center justify-center shrink-0 text-[10px] ${
                    it.done ? 'bg-matcha border-matcha text-white' : 'border-ash/40 bg-white'
                  }">${it.done ? '✓' : ''}</span>
                  <span class="text-xs leading-snug ${it.done ? 'line-through text-ash' : 'text-sumi font-medium'}">${escapeHtml(t(it.label))}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('')}

        <!-- Saily eSIM Activation Guide -->
        <div class="muji-card p-3.5 bg-slateink-light/60 border-slateink/25 space-y-1.5">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slateink-dark">📶 ${dict.esimTitle}</h3>
          <p class="text-xs text-sumi leading-relaxed">1. <b>In Berlin (Wi-Fi):</b> Buy 5GB / 30-Day US plan inside your existing Saily account (no need to reinstall the existing Saily eSIM).</p>
          <p class="text-xs text-sumi leading-relaxed">2. <b>Before Takeoff:</b> Turn OFF <i>Data Roaming</i> on your primary German SIM line.</p>
          <p class="text-xs text-sumi leading-relaxed">3. <b>Upon Landing at EWR:</b> Switch Mobile Data to <b>Saily</b> & enable <i>Data Roaming</i> on Saily.</p>
        </div>
      `;
    }

    function renderApp() {
      renderHeaderAndNav();
      const container = document.getElementById('appContent');
      if (!container) return;

      if (state.activeTab === 'itinerary') {
        container.innerHTML = renderItineraryTab();
      } else if (state.activeTab === 'tickets') {
        container.innerHTML = renderTicketsTab();
      } else if (state.activeTab === 'food') {
        container.innerHTML = renderFoodAndShopTab();
      } else if (state.activeTab === 'travel') {
        container.innerHTML = renderTravelAndBudgetTab();
      } else if (state.activeTab === 'packing') {
        container.innerHTML = renderPackingTab();
      }
    }

    // Boot App
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
      fetchNycWeather();
    });
  </script>
</body>
</html>
